<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Pelo Finance current prototype system architecture and planned hardening</title>
<desc id="desc">Current demo flow from browser to Vercel-hosted React frontend, configured API calls to the FastAPI service hosted separately, SQLAlchemy persistence and seeded synthetic data. A separate dashed panel lists planned controls required before real customer data: verified authentication, per-user ownership and isolated scenarios, managed database with migrations and backups, and approved provider integrations with privacy review.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#9B8F84"/></marker><marker id="terra" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#B84F31"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2A1C15" flood-opacity=".08"/></filter></defs>
