<text x="78" y="490" font-family="Arial,sans-serif" font-size="16" fill="#6B5B4F">Demo records are synthetic. The PeloScore signal is illustrative; no validated credit decision or live bank feed is provided.</text>
<!-- planned hardening boundary -->
<rect x="48" y="572" width="1344" height="350" rx="25" fill="#F8F4ED" stroke="#B84F31" stroke-width="3" stroke-dasharray="12 9"/>
<text x="78" y="614" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#B84F31">PLANNED BEFORE REAL FINANCIAL DATA • NOT ALL IMPLEMENTED</text>
<!-- planned cards -->
<rect x="78" y="651" width="294" height="176" rx="18" fill="#FFFDF8" stroke="#E4D6C7" stroke-width="2"/><text x="102" y="690" font-family="Syne,Arial,sans-serif" font-size="21" font-weight="700" fill="#201A17">Identity &amp; consent</text><text x="102" y="723" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Verified auth at the API</text><text x="102" y="751" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Session expiry + revocation</text><text x="102" y="779" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Explicit consent boundaries</text>
<rect x="400" y="651" width="294" height="176" rx="18" fill="#FFFDF8" stroke="#E4D6C7" stroke-width="2"/><text x="424" y="690" font-family="Syne,Arial,sans-serif" font-size="21" font-weight="700" fill="#201A17">Ownership &amp; isolation</text><text x="424" y="723" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Server-enforced owner checks</text><text x="424" y="751" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Private scenario state</text><text x="424" y="779" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Cross-account negative tests</text>
<rect x="722" y="651" width="294" height="176" rx="18" fill="#FFFDF8" stroke="#E4D6C7" stroke-width="2"/><text x="746" y="690" font-family="Syne,Arial,sans-serif" font-size="21" font-weight="700" fill="#201A17">Data reliability</text><text x="746" y="723" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Managed PostgreSQL</text><text x="746" y="751" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Alembic migrations + backups</text><text x="746" y="779" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Exact money arithmetic</text>
<rect x="1044" y="651" width="318" height="176" rx="18" fill="#FFFDF8" stroke="#E4D6C7" stroke-width="2"/><text x="1068" y="690" font-family="Syne,Arial,sans-serif" font-size="21" font-weight="700" fill="#201A17">Security &amp; external data</text><text x="1068" y="723" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Threats tracked to tests</text><text x="1068" y="751" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Privacy / regulatory review</text><text x="1068" y="779" font-family="Arial,sans-serif" font-size="16" fill="#5D5148">• Approved provider adapter only</text>
<text x="78" y="878" font-family="Arial,sans-serif" font-size="16" fill="#796B5E">Dashed areas represent target work. Do not infer that planned controls are already active because they appear in this diagram.</text>
