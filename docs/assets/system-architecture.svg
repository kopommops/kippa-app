<text x="70" y="70" font-family="Syne,Arial,sans-serif" font-size="38" font-weight="700" fill="#201A17">Pelo Finance | System architecture</text>
<text x="70" y="108" font-family="Arial,sans-serif" font-size="20" fill="#70645C">Current synthetic-data demo (solid) and pre-production hardening work (dashed).</text>
