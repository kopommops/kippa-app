<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D96B43" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Pelo Finance helps people with irregular income understand cash-flow patterns, prepare for lean weeks, and make financial consistency easier to see." />
    <meta name="application-name" content="Pelo Finance" />
    <meta property="og:title" content="Pelo Finance | Make your money story visible" />
    <meta property="og:description" content="See the rhythm behind irregular income and prepare for lean weeks with Pelo Finance." />
    <meta property="og:type" content="website" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('pelo-theme');
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/pelo-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&family=Syne:wght@400..800&display=swap" rel="stylesheet" />
    <title>Pelo Finance | Make your money story visible</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
